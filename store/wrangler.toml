# The perms editor's store on Cloudflare: `npx wrangler deploy` from this folder,
# after `npx wrangler d1 create perms-store` put its id below and
# `npx wrangler d1 execute perms-store --remote --file schema.sql` made the table.
name = "perms-store"
main = "worker.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "perms-store"
database_id = "ff030d07-85bc-4da0-8489-771f89a09649"

# 60 requests a minute per address: a page polls every few seconds, a server every 5.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["*/15 * * * *"]
